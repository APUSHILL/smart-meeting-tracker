spring.application.name=meeting-tracker

# MySQL — reads from env vars, falls back to local defaults for dev
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/meeting_tracker_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:REDACTED_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server — Railway injects PORT; fall back to 8080 for local/Docker
server.port=${PORT:8080}

# Gemini AI
gemini.api.key=${GEMINI_API_KEY:REDACTED_GEMINI_KEY}

# JWT
jwt.secret=${JWT_SECRET:REDACTED_JWT_SECRET}
jwt.expiration=86400000
